<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>copy</title>
<style>body{background:#111;color:#eee;font:16px sans-serif;margin:20px}button{font-size:18px;padding:12px 20px;margin:6px}#s{margin:10px 0;font-size:20px}</style>
<div id="s">ready</div><div id="b"></div>
<script>
const ids=[];for(let i=1;i<=40;i++)ids.push('p'+String(i).padStart(2,'0'));
const b=document.getElementById('b'),s=document.getElementById('s');
ids.forEach(id=>{const x=document.createElement('button');x.id='btn_'+id;x.textContent=id;x.onclick=async()=>{try{const r=await fetch('posts/'+id+'.png?'+Date.now());if(!r.ok)throw new Error(r.status);const bl=await r.blob();await navigator.clipboard.write([new ClipboardItem({'image/png':bl})]);s.textContent='copied '+id+' '+bl.size;}catch(e){s.textContent='ERR '+id+' '+e.message}};b.appendChild(x);});
</script>
