<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>send</title>
<body style="background:#111;color:#eee;font:20px sans-serif"><div id="s">sending</div>
<script>
(async()=>{const q=new URLSearchParams(location.search),id=q.get('id'),ext=q.get('ext')||'png';const s=document.getElementById('s');
try{const r=await fetch('posts/'+id+'.'+ext+'?'+Date.now());const bl=await r.blob();
const tgt=window.opener||(window.parent!==window?window.parent:null);if(!tgt)throw new Error('no opener');
tgt.postMessage({bbsImg:true,id,ext,type:bl.type,blob:bl},'*');s.textContent='sent '+id+' '+bl.size;if(window.opener)setTimeout(()=>window.close(),800);}catch(e){s.textContent='ERR '+e.message}})();
</script>
